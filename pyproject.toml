# Project metadata, dependencies, entry points, and pytest settings for DocSearcher.
# Install: pip install .            (desktop GUI + CLI)
#          pip install '.[dev,mcp]' (tests + MCP server); '.[package]' adds PyInstaller
# Pinned CI/release versions: constraints/ci.txt (see constraints/README.md).
# Python policy: 3.10 (mcp, PyMuPDF, PySide6 minimum) through 3.14 (PySide6 upper bound).

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-searcher"
dynamic = ["version"]
description = "Cross-platform local full-text search for PDF, Office, and text documents."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "PySide6>=6.6.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "olefile>=0.46",
    "jieba>=0.42.1",
]

[project.optional-dependencies]
mcp = ["mcp>=2.2,<3"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "build>=1.0",
    "ruff>=0.16",
    "mypy>=1.10",
    "uv>=0.5",  # regenerates constraints/ci.txt
]
package = ["pyinstaller>=6.0", "Pillow>=10.0"]

[project.scripts]
doc-searcher = "doc_searcher.cli:main"
doc-searcher-mcp = "doc_searcher.integrations.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
doc_searcher = ["assets/*"]

[tool.setuptools.dynamic]
version = { attr = "doc_searcher.version.APP_VERSION" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
# Benchmarks are slow; run them explicitly: pytest tests/benchmarks --benchmark-only
norecursedirs = ["benchmarks"]
markers = [
    "posix: needs POSIX semantics (permissions, symlinks); skipped on Windows",
    "windows: needs native Windows semantics; skipped elsewhere",
    "macos: needs native macOS semantics; skipped elsewhere",
]
# Lets a plain checkout run the suite; an installed copy of the package also works.
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Correctness-focused: pyflakes, syntax/statement errors, and bugbear.
select = ["E4", "E7", "E9", "F", "B"]

[tool.mypy]
python_version = "3.10"
files = ["src/doc_searcher"]
# jieba, olefile, xlrd, python-pptx, pymupdf ship without type information.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.coverage.run]
source = ["doc_searcher"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Baseline measured 2026-09-24 on macOS arm64 / Python 3.13: 82.9% line+branch. CI enforces it on
# Linux / Python 3.12. Raise it when coverage improves; lowering it needs a reviewed change.
fail_under = 82
