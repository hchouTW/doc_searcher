# Purpose: Quality gate (format, lint, types, coverage) and the pytest suite across supported OS/Python.
# What the code does: Installs the hashed lock (constraints/ci.txt) and the project, then runs pytest
#                     headless. The pip cache is keyed by OS, architecture, Python, and lock hash;
#                     --require-hashes re-verifies every file, including cache hits.
# Usage notes: Python policy (pyproject.toml/README) is 3.10–3.14; 3.10 and 3.12 run on every OS,
#              3.14 on Linux as the representative upper bound. Actions are pinned to commit SHAs.
#              Reusable: dependency-refresh.yml calls it with a candidate lock artifact.
#              Mark the "quality" and "pytest" jobs as required checks in branch protection.
name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to test (defaults to the triggering ref).
        type: string
        default: ''
      constraints-artifact:
        description: Artifact holding a candidate constraints/ci.txt to test instead of the committed one.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  quality:
    name: quality (format, lint, types, coverage)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
    - name: Check out repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        ref: ${{ inputs.ref }}

    - name: Set up Python 3.12
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'

    - name: Use candidate lock
      if: inputs.constraints-artifact != ''
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: ${{ inputs.constraints-artifact }}
        path: constraints

    - name: Install Qt system libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libglib2.0-0 libdbus-1-3

    - name: Install locked dependencies
      run: |
        python -m pip install --require-hashes -r constraints/ci.txt
        python -m pip install --no-deps --no-build-isolation -e .

    - name: Ruff format
      run: ruff format --check .

    - name: Ruff lint
      run: ruff check .

    - name: Mypy
      run: python -m mypy

    - name: Pytest with coverage (fails below the pyproject.toml baseline)
      run: python -m pytest --cov=doc_searcher --cov-report=term-missing --cov-report=xml

    - name: Publish coverage summary
      if: always()
      run: |
        if [ -f coverage.xml ]; then
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
        import xml.etree.ElementTree as ET
        root = ET.parse("coverage.xml").getroot()
        line, branch = float(root.get("line-rate")), float(root.get("branch-rate"))
        print(f"### Coverage\n\nLines {line:.1%} · Branches {branch:.1%}")
        PY
        fi

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: coverage-report
        path: coverage.xml
        if-no-files-found: ignore

  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python: [ '3.10', '3.12' ]
        include:
          - os: ubuntu-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen  # headless Qt for the UI tests

    steps:
    - name: Check out repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        ref: ${{ inputs.ref }}

    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python }}

    - name: Use candidate lock
      if: inputs.constraints-artifact != ''
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: ${{ inputs.constraints-artifact }}
        path: constraints

    - name: Locate pip cache
      id: pip-cache
      shell: bash
      run: echo "dir=$(python -m pip cache dir)" >> "$GITHUB_OUTPUT"

    - name: Cache pip downloads
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.pip-cache.outputs.dir }}
        key: pip-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python }}-${{ hashFiles('constraints/ci.txt') }}

    - name: Install Qt system libraries (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libglib2.0-0 libdbus-1-3

    - name: Install locked dependencies
      run: |
        python -m pip install --require-hashes -r constraints/ci.txt
        python -m pip install --no-deps --no-build-isolation -e .
        python -m pip check

    - name: Check console entry points
      run: |
        doc-searcher --version
        doc-searcher --help

    - name: Run pytest
      run: python -m pytest tests/ -v
