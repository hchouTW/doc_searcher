# Purpose: Run the pytest suite across the supported OS and Python range.
# What the code does: Installs the project with its dev and mcp extras, then runs pytest headless.
# Usage notes: Python policy (pyproject.toml/README) is 3.10–3.14; 3.10 and 3.12 run on every OS,
#              3.14 on Linux as the representative upper bound.
name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python: [ '3.10', '3.12' ]
        include:
          - os: ubuntu-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen  # headless Qt for the UI tests

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}

    - name: Install Qt system libraries (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libglib2.0-0 libdbus-1-3

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev,mcp]"

    - name: Check console entry points
      run: |
        doc-searcher --version
        doc-searcher --help

    - name: Run pytest
      run: python -m pytest tests/ -v
