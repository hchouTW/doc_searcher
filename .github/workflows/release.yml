# Purpose: Publish a DocSearcher release: all native builds plus SHA-256 checksums, or nothing.
# What the code does:
#   1. check-tag: compares the tag with src/doc_searcher/version.py (stdlib only, seconds) so a
#      mismatch stops before any dependency install or packaging.
#   2. tests + build: the reusable tests.yml and build.yml at the tag (build.yml gates every artifact
#      on its packaged --self-check, version, and architecture).
#   3. publish: runs only if every test and build job succeeded; checks the exact asset set, writes
#      SHA256SUMS.txt, and creates/updates the GitHub Release.
# Usage notes: Trigger semantics — one trigger per release: pushing tag v<APP_VERSION> (including a
#              tag created from the GitHub "Draft a new release" page). `release: published` is not a
#              trigger, so one tag never starts two workflows. Runs for the same tag queue instead of
#              cancelling each other, so a publish is never interrupted. workflow_dispatch rebuilds an
#              existing tag as a dry run (artifacts + checksums uploaded, nothing published) unless
#              `publish` is ticked.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v1.2.0
        required: true
        type: string
      publish:
        description: Publish the GitHub Release (unticked = dry run)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  check-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Check out tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Tag must match APP_VERSION
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 scripts/check_release_tag.py "$RELEASE_TAG"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  tests:
    needs: check-tag
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ needs.check-tag.outputs.tag }}

  build:
    needs: check-tag
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.check-tag.outputs.tag }}

  publish:
    name: Publish release assets
    needs: [ check-tag, tests, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.check-tag.outputs.tag }}
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
    steps:
      - name: Download all native builds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: DocSearcher-*
          path: release-assets
          merge-multiple: true

      - name: Check the asset set and write checksums
        working-directory: release-assets
        run: |
          expected="DocSearcher-Windows-x64.exe
          DocSearcher-macOS-arm64.zip
          DocSearcher-macOS-x86_64.zip"
          actual="$(ls -1 | sort)"
          if [ "$actual" != "$(printf '%s\n' "$expected" | sed 's/^ *//' | sort)" ]; then
            printf 'Unexpected release assets:\n%s\n' "$actual"
            exit 1
          fi
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload dry-run bundle
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dry-run
          path: release-assets/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
