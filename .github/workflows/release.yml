# Purpose: Publish a DocSearcher release: all native builds plus SHA-256 checksums, or nothing.
# What the code does:
#   1. check-tag: compares the tag with src/doc_searcher/version.py (stdlib only, seconds) so a
#      mismatch stops before any dependency install or packaging.
#   2. tests + build: the reusable tests.yml and build.yml at the tag (build.yml gates every artifact
#      on its packaged --self-check, version, and architecture).
#   3. sign (only when vars.SIGNING_ENABLED == 'true'): Developer ID + notarization on macOS,
#      Authenticode on Windows, then the self-check again on the signed artifacts.
#   4. publish: runs only if every test, build, and (enabled) signing job succeeded; checks the
#      exact asset set, writes SHA256SUMS.txt, and creates/updates the GitHub Release.
# Usage notes: Trigger semantics — one trigger per release: pushing tag v<APP_VERSION> (including a
#              tag created from the GitHub "Draft a new release" page). `release: published` is not a
#              trigger, so one tag never starts two workflows. Runs for the same tag queue instead of
#              cancelling each other, so a publish is never interrupted. workflow_dispatch rebuilds an
#              existing tag as a dry run (artifacts + checksums uploaded, nothing published) unless
#              `publish` is ticked.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v1.2.0
        required: true
        type: string
      publish:
        description: Publish the GitHub Release (unticked = dry run)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  check-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Check out tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Tag must match APP_VERSION
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 scripts/check_release_tag.py "$RELEASE_TAG"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  tests:
    needs: check-tag
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ needs.check-tag.outputs.tag }}

  build:
    needs: check-tag
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.check-tag.outputs.tag }}

  sign:
    # Enabled by the repository variable SIGNING_ENABLED=true once credentials are stored in the
    # protected "release-signing" environment (see docs/signing.md). Runs only for tag pushes and
    # manual dispatch, never for pull requests, so forks cannot reach the secrets.
    needs: [ check-tag, build ]
    if: vars.SIGNING_ENABLED == 'true'
    name: sign (${{ matrix.asset }})
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            asset: DocSearcher-macOS-arm64
            file: DocSearcher-macOS-arm64.zip
          - runner: windows-latest
            arch: x86_64
            asset: DocSearcher-Windows-x64
            file: DocSearcher-Windows-x64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.check-tag.outputs.tag }}

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Download unsigned build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.asset }}
          path: dist

      - name: Sign, notarize, and verify (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          FILE: ${{ matrix.file }}
          ARCH: ${{ matrix.arch }}
        run: |
          packaging/sign_mac.sh "dist/$FILE"
          ditto -x -k "dist/$FILE" signed
          codesign --verify --deep --strict --verbose=2 signed/DocSearcher.app
          spctl --assess --type execute --verbose signed/DocSearcher.app
          python scripts/verify_build.py signed/DocSearcher.app/Contents/MacOS/DocSearcher --arch "$ARCH"

      - name: Sign and verify (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          FILE: ${{ matrix.file }}
          ARCH: ${{ matrix.arch }}
        run: |
          ./packaging/sign_win.ps1 -Path "dist/$env:FILE"
          python scripts/verify_build.py "dist/$env:FILE" --arch $env:ARCH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Replace the artifact with the signed build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.file }}
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    name: Publish release assets
    needs: [ check-tag, tests, build, sign ]
    # sign is skipped while SIGNING_ENABLED is unset (unsigned release, as before); when it runs,
    # any failure blocks publication.
    if: >-
      always() && needs.check-tag.result == 'success' && needs.tests.result == 'success' &&
      needs.build.result == 'success' &&
      (needs.sign.result == 'success' || needs.sign.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.check-tag.outputs.tag }}
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
    steps:
      - name: Download all native builds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: DocSearcher-*
          path: release-assets
          merge-multiple: true

      - name: Check the asset set and write checksums
        working-directory: release-assets
        run: |
          expected="DocSearcher-Windows-x64.exe
          DocSearcher-macOS-arm64.zip"
          actual="$(ls -1 | sort)"
          if [ "$actual" != "$(printf '%s\n' "$expected" | sed 's/^ *//' | sort)" ]; then
            printf 'Unexpected release assets:\n%s\n' "$actual"
            exit 1
          fi
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload dry-run bundle
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dry-run
          path: release-assets/
          if-no-files-found: error

      # action-gh-release appends freshly generated notes to an existing release body, so a rebuild
      # of a published tag would duplicate them; generate notes only when creating the release.
      - name: Check for an existing release
        id: existing
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: ${{ steps.existing.outputs.exists != 'true' }}
