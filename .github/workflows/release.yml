# Purpose: Build and publish native DocSearcher binaries from a version tag or published release.
# What the code does: Tests, packages, and uploads Windows and both macOS architectures to one release.
# Usage notes: Push v<APP_VERSION> or publish that tag as a release; the tag must match src/doc_searcher/version.py.
name: Build and publish release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    if: startsWith(github.event.release.tag_name || github.ref_name, 'v')
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            asset: DocSearcher-macOS-arm64
          - runner: macos-15-intel
            arch: x86_64
            asset: DocSearcher-macOS-x86_64
          - runner: windows-latest
            arch: x86_64
            asset: DocSearcher-Windows-x64
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r constraints/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Check tag matches application version
        run: python -c "import os; from doc_searcher.version import APP_VERSION; assert os.environ['RELEASE_TAG'] == 'v' + APP_VERSION, 'Release tag must match src/doc_searcher/version.py'"

      - name: Run tests
        run: python -m pytest -q

      - name: Clean prior build outputs
        run: python -c "import shutil; from pathlib import Path; [shutil.rmtree(path, ignore_errors=True) for path in (Path('build'), Path('dist'))]"

      - name: Build macOS application
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller packaging/doc_searcher_mac.spec --clean --noconfirm
          python scripts/verify_build.py dist/DocSearcher.app/Contents/MacOS/DocSearcher --arch ${{ matrix.arch }}
          ditto -c -k --sequesterRsrc --keepParent dist/DocSearcher.app dist/${{ matrix.asset }}.zip

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m PyInstaller packaging/doc_searcher_win.spec --clean --noconfirm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_build.py dist/DocSearcher.exe --arch ${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item dist/DocSearcher.exe dist/${{ matrix.asset }}.exe

      - name: Upload macOS build
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.exe
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all native builds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: DocSearcher-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: ${{ github.event_name == 'push' }}
